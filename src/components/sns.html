<section class="sns" aria-labelledby="{{labelId}}">
  <p id="{{labelId}}" class="sns__label">{{label}}</p>
  <ul class="sns__list">
    <li class="sns__item">
      <a class="sns__btn sns__btn--iconOnly" href="#" target="_blank" rel="noopener noreferrer" aria-label="Xでシェア">
        <img src="./img/sns_icon_x.svg" alt="" width="20" height="20" decoding="async">
      </a>
    </li>
    <li class="sns__item">
      <a class="sns__btn sns__btn--iconOnly" href="#" target="_blank" rel="noopener noreferrer" aria-label="Facebookでシェア">
        <img src="./img/sns_icon_facebook.svg" alt="" width="20" height="20" decoding="async">
      </a>
    </li>
    <li class="sns__item sns__item--copy">
      <button type="button" class="sns__btn sns__btn--copy js-sns-copy" aria-label="リンクをコピー">
        <span class="sns__btnIcon" aria-hidden="true">
          <img src="./img/sns_icon_copy.svg" alt="" width="20" height="20" decoding="async">
        </span>
        <span class="sns__btnLabel">リンクをコピー</span>
      </button>
      <span class="sns__tooltip js-sns-copy-tooltip" role="status" aria-live="polite" hidden>リンクをコピーしました</span>
    </li>
  </ul>
</section>
