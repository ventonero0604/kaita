<section class="storySection" aria-labelledby="storySection-heading">
  <div class="storySection__intro">
    <p class="storySection__label">Kaitaful Days.</p>
    <h2 id="storySection-heading" class="storySection__title">
      <span class="storySection__titleLine">KAITA TOWN</span>
      <span class="storySection__titleLine">70 STORIES</span>
    </h2>
    <p class="storySection__lead">
      海田町の魅力を再発見する70の物語を公開。先人たちが築き上げた歴史と文化、そして未来へと向かう新しい息吹。海田町を彩る70の魅力（Kaitaful）を紐解きます。
    </p>
  </div>

  <div class="storyCarousel js-story-carousel">
    <div class="storyCarousel__viewport js-story-viewport" tabindex="0" aria-roledescription="carousel">
      <div class="storyCarousel__track js-story-track">
        <button type="button" class="storyCarousel__slide js-story-slide" data-story-id="1" data-story-title="Story 01"
          aria-label="ストーリー詳細を開く">
          <span class="storyCarousel__imgWrap"><img src="{{assetBase}}img/flowing_photo_1.png" alt="" width="525" height="657"
              loading="lazy" decoding="async"></span>
        </button>
        <button type="button" class="storyCarousel__slide js-story-slide" data-story-id="2" data-story-title="Story 02"
          aria-label="ストーリー詳細を開く">
          <span class="storyCarousel__imgWrap"><img src="{{assetBase}}img/flowing_photo_2.png" alt="" width="525" height="657"
              loading="lazy" decoding="async"></span>
        </button>
        <button type="button" class="storyCarousel__slide js-story-slide" data-story-id="3" data-story-title="Story 03"
          aria-label="ストーリー詳細を開く">
          <span class="storyCarousel__imgWrap"><img src="{{assetBase}}img/flowing_photo_3.png" alt="" width="525" height="657"
              loading="lazy" decoding="async"></span>
        </button>
        <button type="button" class="storyCarousel__slide js-story-slide" data-story-id="4" data-story-title="Story 04"
          aria-label="ストーリー詳細を開く">
          <span class="storyCarousel__imgWrap"><img src="{{assetBase}}img/flowing_photo_4.png" alt="" width="525" height="657"
              loading="lazy" decoding="async"></span>
        </button>
        <button type="button" class="storyCarousel__slide js-story-slide" data-story-id="5" data-story-title="Story 05"
          aria-label="ストーリー詳細を開く">
          <span class="storyCarousel__imgWrap"><img src="{{assetBase}}img/concept_collage.jpg" alt="" width="525" height="657"
              loading="lazy" decoding="async"></span>
        </button>
        <button type="button" class="storyCarousel__slide js-story-slide" data-story-id="6" data-story-title="Story 06"
          aria-label="ストーリー詳細を開く">
          <span class="storyCarousel__imgWrap"><img src="{{assetBase}}img/footer_photo.png" alt="" width="525" height="657"
              loading="lazy" decoding="async"></span>
        </button>
        <button type="button" class="storyCarousel__slide js-story-slide" data-story-id="7" data-story-title="Story 07"
          aria-label="ストーリー詳細を開く">
          <span class="storyCarousel__imgWrap"><img src="{{assetBase}}img/flowing_photo_7.png" alt="" width="525" height="657"
              loading="lazy" decoding="async"></span>
        </button>
        <button type="button" class="storyCarousel__slide js-story-slide" data-story-id="8" data-story-title="Story 08（ダミー）"
          aria-label="ストーリー詳細を開く">
          <span class="storyCarousel__imgWrap"><img src="{{assetBase}}img/flowing_photo_4.png" alt="" width="525" height="657"
              loading="lazy" decoding="async"></span>
        </button>
      </div>
    </div>

    <div class="storyCarousel__footer">
      <div class="storyCarousel__navRow">
        <button type="button" class="storyCarousel__navBtn storyCarousel__navBtn--prev js-story-prev"
          aria-label="前のストーリーへ">
          <img src="{{assetBase}}img/story_arrow.svg" alt="" width="24" height="24">
        </button>
        <button type="button" class="storyCarousel__navBtn storyCarousel__navBtn--next js-story-next"
          aria-label="次のストーリーへ">
          <img src="{{assetBase}}img/story_arrow.svg" alt="" width="24" height="24">
        </button>
      </div>
      <a href="{{url.story}}" class="Button Button--dark storyCarousel__cta">
        <span class="Button__label">海田町70のストーリー</span>
        <span class="Button__meta" aria-hidden="true">
          <span class="Button__divider">
            <img src="{{assetBase}}img/concept_btn_divider.svg" alt="" width="1" height="23">
          </span>
          <span class="Button__icon">
            <img src="{{assetBase}}img/concept_btn_arrow.svg" alt="" width="16" height="16">
          </span>
        </span>
      </a>
    </div>
  </div>

  <div id="storyModal" class="storyModal js-story-modal" role="dialog" aria-modal="true" aria-labelledby="storyModal-title"
    aria-hidden="true">
    <div class="storyModal__overlay js-story-modal-close" tabindex="-1"></div>
    <div class="storyModal__panel">
      <button type="button" class="storyModal__close js-story-modal-close" aria-label="閉じる">&times;</button>
      <h3 id="storyModal-title" class="storyModal__title">ストーリー</h3>
      <p class="storyModal__note">一覧ページは準備中です。このモーダルから詳細へ遷移できるようになります。</p>
      <p class="storyModal__caption js-story-modal-caption"></p>
    </div>
  </div>
</section>
